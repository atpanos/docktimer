name: Security

on:
  push:
    branches: [main, beta]
  pull_request:
  schedule:
    # New CVEs appear without code changes, so re-scan every Monday.
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # required to upload SARIF to the Security tab
  actions: read

jobs:
  trivy-fs:
    name: Trivy (deps, IaC, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true
          # Report-only for now: findings show up in the Security tab instead of
          # turning CI red. Flip to "1" once the initial findings are triaged.
          exit-code: "0"

      # Pull requests from forks get a read-only GITHUB_TOKEN, so they cannot
      # upload SARIF. The scan itself still runs and fails loudly on errors.
      - name: Upload results to the Security tab
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy (container image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: docktimer:scan
          build-args: |
            VERSION=scan
          # Separate cache scope so this does not collide with docker-publish.yml.
          cache-from: type=gha,scope=trivy
          cache-to: type=gha,mode=max,scope=trivy

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: docktimer:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Upload results to the Security tab
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
